services:
  # Main application service
  web:
    container_name: timeoff
    image: ashless/timeoff-alien
    build: .
    # All settings from .env are passed to the container; the entries below override it.
    env_file: .env
    environment:
      # Local DB (DOCKER_DB_URL) if set, otherwise the external DATABASE_URL
      DATABASE_URL: ${DOCKER_DB_URL:-${DATABASE_URL}}
      APP_PORT: ${APP_PORT}
    ports:
      - "${APP_PORT}:${APP_PORT}"
    restart: unless-stopped

  # Local PostgreSQL Database (remove this service and the volume below
  # if you use an external DATABASE_URL)
  postgres:
    image: postgres:15-alpine
    container_name: ${DB_HOST}
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  # Database Admin Tool (Optional)
  # Uncomment to use Adminer for database management
  # adminer:
  #   image: adminer
  #   container_name: timeoff-admin
  #   restart: always
  #   ports:
  #     - "8080:8080"
  #   environment:
  #     ADMINER_DEFAULT_SERVER: ${DB_HOST}
  #     ADMINER_DEFAULT_DB: ${DB_DATABASE}
  #     ADMINER_DEFAULT_USER: ${DB_USER}
  #     ADMINER_DEFAULT_PASSWORD: ${DB_PASSWORD}

volumes:
  postgres_data:    # Only used if local postgres is enabled

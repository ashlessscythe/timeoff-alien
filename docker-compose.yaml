services:
  # Main application service
  web:
    container_name: timeoff
    image: ashless/timeoff-alien
    environment:
      # Core settings
      DATABASE_URL: ${DOCKER_DB_URL}
      APP_PORT: ${APP_PORT}
      # Security settings
      SESSION_SECRET: ${SESSION_SECRET}
      OPTION_ALLOW_NEW_REGISTRATIONS: ${OPTION_ALLOW_NEW_REGISTRATIONS}
      # SSL settings
      USE_SSL: ${USE_SSL}
      # Email settings (if configured)
      SMTP_AUTH_PASS: ${SMTP_AUTH_PASS}
      SMTP_AUTH_USER: ${SMTP_AUTH_USER}
      SMTP_FROM: ${SMTP_FROM}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_REQUIRE_TLS: ${SMTP_REQUIRE_TLS}
    ports:
      - "${APP_PORT}:${APP_PORT}"
    restart: unless-stopped

  # Local PostgreSQL Database (Optional)
  # To use local database:
  # 1. Comment out DATABASE_URL in your .env file
  # 2. Uncomment the postgres service below
  # 3. Set DB_* variables in your .env file
  postgres:
    image: postgres:15-alpine
    container_name: ${DB_HOST}
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  # Database Admin Tool (Optional)
  # Uncomment to use Adminer for database management
  # adminer:
  #   image: adminer
  #   container_name: timeoff-admin
  #   restart: always
  #   ports:
  #     - "8080:8080"
  #   environment:
  #     ADMINER_DEFAULT_SERVER: ${DB_HOST}
  #     ADMINER_DEFAULT_DB: ${DB_DATABASE}
  #     ADMINER_DEFAULT_USER: ${DB_USER}
  #     ADMINER_DEFAULT_PASSWORD: ${DB_PASSWORD}

volumes:
  postgres_data:    # Only used if local postgres is enabled
